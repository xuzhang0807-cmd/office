name: office

# 与 blog 共用外部网络时，把 NETWORK 指向 blog 的网络（见 .env）
# 默认只绑定回环，公网由宿主机 nginx / Cloudflare Tunnel 暴露。

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  office:
    <<: *hardening
    build: .
    image: office:${IMAGE_TAG:-latest}
    container_name: office
    env_file: [.env]
    environment:
      NODE_ENV: production
      OFFICE_HOST: 0.0.0.0
      OFFICE_PORT: "32110"
      OFFICE_DATA_DIR: /data
      # 容器内不能走 127.0.0.1 访问 muse2api，默认走共享 Docker 网络的容器名
      OFFICE_MUSE_BASE: ${OFFICE_MUSE_BASE_DOCKER:-http://muse2api:18610}
      # 密钥由 deploy.sh 从 ../muse2api/.env 自动同步进 .env
      OFFICE_MUSE_KEY: ${OFFICE_MUSE_KEY:-}
    volumes:
      - data:/data
    ports: ["127.0.0.1:${OFFICE_HOST_PORT:-32110}:32110"]
    networks: [default, muse]
    # muse2api 默认只监听宿主机回环，容器里通过 host-gateway 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256

volumes:
  data:

networks:
  default:
    name: ${OFFICE_NETWORK:-office_default}
  # 复用 muse2api 已有网络：容器内直接以 http://muse2api:18610 访问，无需 host-gateway
  muse:
    external: true
    name: ${MUSE_NETWORK:-muse2api_default}
