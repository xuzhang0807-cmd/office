# 反向代理示例：把 office.example.com 指到本机容器。
# 放到宿主机 /etc/nginx/conf.d/office.conf，改域名与证书路径即可。

upstream office_portal {
    server 127.0.0.1:32110;
    keepalive 16;
}

server {
    listen 80;
    server_name office.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name office.example.com;

    ssl_certificate     /etc/letsencrypt/live/office.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.example.com/privkey.pem;

    client_max_body_size 32m;

    # 安全头：应用自身也会设置，这里补上 HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://office_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 生图可能 40-60s
        proxy_send_timeout 300s;
    }

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        proxy_pass http://office_portal;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
